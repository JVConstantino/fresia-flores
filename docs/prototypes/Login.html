<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Entrar — Frésia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/tokens.css" />
<style>
  body { background: var(--ink-50); min-height: 100vh; }
  .auth-shell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  /* Visual side */
  .visual {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, var(--lilac-100), var(--petal-100));
    padding: 56px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .visual img.bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.5;
    mix-blend-mode: multiply;
  }
  .visual::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(155, 131, 230, 0.2), rgba(245, 169, 140, 0.15));
    pointer-events: none;
  }
  .visual > * { position: relative; z-index: 1; }

  .vs-logo { font-family: var(--font-display); font-style: italic; font-size: 48px; color: white; display: inline-flex; align-items: baseline; gap: 6px; }
  .vs-logo::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--petal-400); transform: translateY(-20px); }

  .vs-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: var(--radius-xl);
    padding: 36px;
    max-width: 420px;
  }
  .vs-card .kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lilac-700); font-weight: 600; margin-bottom: 14px; }
  .vs-card h2 { font-size: 36px; line-height: 1.1; margin-bottom: 14px; color: var(--ink-900); }
  .vs-card h2 em { font-style: italic; color: var(--lilac-600); font-weight: 400; }
  .vs-card p { font-size: 14px; color: var(--ink-700); line-height: 1.6; margin: 0; }

  .vs-testimonial {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 380px;
  }
  .vs-testimonial .q { font-family: var(--font-display); font-size: 16px; color: var(--ink-900); line-height: 1.5; margin-bottom: 14px; }
  .vs-testimonial .a { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-700); }
  .vs-testimonial .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--lilac-400), var(--petal-400)); }

  /* Form side */
  .form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px;
    background: white;
  }
  .form-box { width: 100%; max-width: 440px; }
  .form-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
  .form-top img { height: 36px; }
  .form-top a { font-size: 13px; color: var(--ink-500); }
  .form-top a:hover { color: var(--ink-900); }

  .form-title { font-size: 40px; line-height: 1.1; margin-bottom: 12px; }
  .form-title em { color: var(--lilac-600); font-style: italic; font-weight: 400; }
  .form-sub { font-size: 14px; color: var(--ink-500); margin-bottom: 40px; }

  .tab-switch {
    display: flex;
    background: var(--ink-100);
    padding: 4px;
    border-radius: var(--radius-pill);
    margin-bottom: 32px;
  }
  .tab-switch button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-500);
    transition: all 0.15s;
  }
  .tab-switch button.active { background: white; color: var(--ink-900); box-shadow: var(--shadow-sm); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 12px; color: var(--ink-600); font-weight: 500; margin-bottom: 8px; }
  .field .input-wrap { position: relative; }
  .field .input-wrap .icon-left { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ink-400); }
  .field input { padding-left: 46px !important; padding-top: 14px !important; padding-bottom: 14px !important; }
  .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-400); cursor: pointer; }
  .pw-toggle:hover { color: var(--ink-700); }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 24px; }
  .check-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-600); cursor: pointer; }
  .check-label .box { width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 4px; background: white; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
  .check-label.on .box { background: var(--ink-900); border-color: var(--ink-900); color: white; }
  .forgot { font-size: 13px; color: var(--lilac-600); }
  .forgot:hover { color: var(--lilac-700); }

  .btn-submit { width: 100%; padding: 16px; background: var(--ink-900); color: white; border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; }
  .btn-submit:hover { background: var(--ink-800); box-shadow: var(--shadow-lg); transform: translateY(-1px); }

  .or { display: flex; align-items: center; gap: 14px; margin: 28px 0 18px; font-size: 12px; color: var(--ink-400); }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .social-btn {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: white;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13px; color: var(--ink-800); font-weight: 500;
  }
  .social-btn:hover { border-color: var(--ink-500); }

  .bottom-note { text-align: center; margin-top: 32px; font-size: 13px; color: var(--ink-500); }
  .bottom-note a { color: var(--lilac-600); font-weight: 500; }

  @media (max-width: 900px) {
    .auth-shell { grid-template-columns: 1fr; }
    .visual { display: none; }
    .form-side { padding: 32px 24px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  const { useState } = React;

  const App = () => {
    const [mode, setMode] = useState('login');
    const [remember, setRemember] = useState(true);
    const [showPw, setShowPw] = useState(false);

    return (
      <div className="auth-shell">
        <div className="visual">
          <img className="bg" src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?w=1200&q=80" alt="" />
          <div className="vs-logo">Frésia</div>

          <div className="vs-card">
            <div className="kicker">Sua conta Frésia</div>
            <h2>Flores <em>todo</em> mês na sua porta.</h2>
            <p>Clientes Frésia têm acesso antecipado a coleções sazonais, preços especiais e assinatura semanal de arranjos frescos.</p>
          </div>

          <div className="vs-testimonial">
            <div className="q">"Não imaginei que flores pudessem ter esse impacto na minha rotina — toda quarta chega um arranjo novo."</div>
            <div className="a">
              <div className="av"></div>
              <div>
                <div style={{fontWeight: 500, color: 'var(--ink-900)'}}>Beatriz F.</div>
                <div style={{fontSize: 12, color: 'var(--ink-500)'}}>Assinante há 2 anos</div>
              </div>
            </div>
          </div>
        </div>

        <div className="form-side">
          <div className="form-box">
            <div className="form-top">
              <a href="Home.html"><img src="assets/logo-fresia.png" alt="Frésia" /></a>
              <a href="Home.html">← Voltar ao site</a>
            </div>

            <h1 className="form-title">{mode === 'login' ? <>Bom <em>revê-la</em>.</> : <>Bem-<em>vinda</em>.</>}</h1>
            <p className="form-sub">{mode === 'login' ? 'Entre para ver seus pedidos, favoritos e endereços.' : 'Crie sua conta em menos de um minuto.'}</p>

            <div className="tab-switch">
              <button className={mode === 'login' ? 'active' : ''} onClick={() => setMode('login')}>Entrar</button>
              <button className={mode === 'register' ? 'active' : ''} onClick={() => setMode('register')}>Criar conta</button>
            </div>

            <form onSubmit={e => e.preventDefault()}>
              {mode === 'register' && (
                <div className="field">
                  <label>Nome completo</label>
                  <div className="input-wrap">
                    <svg className="icon icon-sm icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
                    <input className="input" placeholder="Beatriz Ferreira" />
                  </div>
                </div>
              )}
              <div className="field">
                <label>E-mail</label>
                <div className="input-wrap">
                  <svg className="icon icon-sm icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
                  <input className="input" type="email" placeholder="seu@email.com" defaultValue="beatriz@email.com" />
                </div>
              </div>
              <div className="field">
                <label>Senha</label>
                <div className="input-wrap">
                  <svg className="icon icon-sm icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input className="input" type={showPw ? 'text' : 'password'} placeholder="••••••••••" defaultValue="senha-secreta" />
                  <span className="pw-toggle" onClick={() => setShowPw(!showPw)}>
                    <svg className="icon icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </span>
                </div>
              </div>

              <div className="row-between">
                <div className={`check-label ${remember ? 'on' : ''}`} onClick={() => setRemember(!remember)}>
                  <span className="box">
                    {remember && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M20 6 9 17l-5-5"/></svg>}
                  </span>
                  Lembrar de mim
                </div>
                {mode === 'login' && <a href="#" className="forgot">Esqueci a senha</a>}
              </div>

              <button type="submit" className="btn-submit">
                {mode === 'login' ? 'Entrar' : 'Criar conta'}
              </button>

              <div className="or">ou continue com</div>

              <div className="social-row">
                <button type="button" className="social-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Google
                </button>
                <button type="button" className="social-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                  Apple
                </button>
              </div>
            </form>

            <div className="bottom-note">
              {mode === 'login' ? (
                <>Ainda não tem conta? <a onClick={() => setMode('register')} style={{cursor: 'pointer'}}>Criar uma conta grátis</a></>
              ) : (
                <>Já é cliente? <a onClick={() => setMode('login')} style={{cursor: 'pointer'}}>Entre aqui</a></>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
