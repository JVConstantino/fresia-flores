<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Rastreio — Frésia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shared.css" />
<style>
  .track-head { padding: 32px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .track-head h1 { font-size: clamp(36px, 4vw, 48px); }
  .track-head h1 em { color: var(--lilac-600); font-style: italic; font-weight: 400; }
  .track-head p { color: var(--ink-500); font-size: 14px; margin-top: 6px; }
  .th-right { display: flex; gap: 10px; }

  .track-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; align-items: start; margin-bottom: 40px; }
  .t-panel { background: white; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

  .t-header { padding: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }
  .t-order-num { font-family: var(--font-display); font-size: 30px; font-weight: 500; color: var(--ink-900); }
  .t-status-group { display: flex; gap: 8px; }
  .stat-pill { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
  .stat-way { background: var(--lilac-100); color: var(--lilac-700); }
  .stat-delay { background: var(--petal-100); color: var(--petal-600); }
  .nav-arrows { display: flex; gap: 6px; }
  .nav-arrows button { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-md); background: white; color: var(--ink-700); display: inline-flex; align-items: center; justify-content: center; }
  .nav-arrows button:hover { border-color: var(--ink-900); }

  .t-body { padding: 24px; }

  .t-meta { font-size: 13px; color: var(--ink-500); margin-bottom: 16px; }
  .t-meta .order-link { color: var(--lilac-600); }
  .t-actions { display: flex; gap: 10px; margin-bottom: 24px; }
  .btn-cancel { padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: white; font-size: 13px; font-weight: 500; color: var(--ink-700); display: inline-flex; align-items: center; gap: 8px; }
  .btn-notify { padding: 10px 18px; background: var(--petal-400); color: white; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .btn-notify:hover { background: var(--petal-500); }

  .route-card { background: var(--ink-50); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 24px; }
  .route-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .route-points { flex: 1; }
  .rp-dot { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-800); padding: 4px 0; }
  .rp-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-900); }
  .rp-dot.to::before { background: var(--petal-400); }
  .rp-line { margin-left: 3px; width: 2px; height: 16px; background: var(--ink-300); }
  .carrier { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--ink-900); display: inline-flex; gap: 6px; align-items: center; }
  .carrier .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lilac-500); }

  .progress-row { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; position: relative; }
  .progress-row::before { content: ''; position: absolute; top: 20px; left: 20px; right: 20px; height: 2px; background: var(--ink-200); }
  .progress-row::after { content: ''; position: absolute; top: 20px; left: 20px; width: 60%; height: 2px; background: var(--ink-900); }
  .p-node { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .p-bubble { width: 40px; height: 40px; border-radius: 50%; background: white; border: 2px solid var(--ink-200); color: var(--ink-400); display: inline-flex; align-items: center; justify-content: center; }
  .p-node.done .p-bubble { background: var(--ink-900); border-color: var(--ink-900); color: white; }
  .p-node.now .p-bubble { background: var(--lilac-500); border-color: var(--lilac-500); color: white; box-shadow: 0 0 0 4px var(--lilac-100); animation: pulse2 2s infinite; }
  @keyframes pulse2 { 50% { box-shadow: 0 0 0 10px transparent; } }
  .p-label { font-size: 11px; color: var(--ink-500); font-weight: 500; }
  .p-node.done .p-label, .p-node.now .p-label { color: var(--ink-900); }

  .t-times { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px 0; border-top: 1px solid var(--border); }
  .tt .k { font-size: 12px; color: var(--ink-500); margin-bottom: 4px; }
  .tt .v { font-size: 14px; color: var(--ink-900); font-weight: 500; }

  .alert {
    display: flex; gap: 12px;
    padding: 16px;
    background: var(--petal-50);
    border: 1px solid var(--petal-200);
    border-radius: var(--radius-md);
    margin-top: 20px;
  }
  .alert .ic { width: 36px; height: 36px; border-radius: 50%; background: white; color: var(--petal-600); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .alert strong { display: block; font-size: 13px; color: var(--ink-900); margin-bottom: 4px; }
  .alert p { font-size: 12px; color: var(--ink-600); line-height: 1.5; }

  .timeline { padding: 24px; }
  .timeline h3 { font-family: var(--font-sans); font-size: 14px; font-weight: 600; margin-bottom: 20px; }
  .event { display: grid; grid-template-columns: 16px 1fr auto; gap: 14px; padding: 10px 0; position: relative; }
  .event-line {
    position: absolute; left: 7px; top: 28px; bottom: -10px;
    width: 2px; background: var(--ink-200);
  }
  .event:last-child .event-line { display: none; }
  .event-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ink-200); margin-top: 4px; position: relative; z-index: 1; }
  .event.done .event-dot { background: var(--ink-900); }
  .event.current .event-dot { background: var(--lilac-500); box-shadow: 0 0 0 4px var(--lilac-100); }
  .event-name { font-size: 13px; color: var(--ink-900); font-weight: 500; margin-bottom: 3px; }
  .event-desc { font-size: 12px; color: var(--ink-500); line-height: 1.5; }
  .event-time { font-size: 12px; color: var(--ink-500); white-space: nowrap; }

  /* Map */
  .map {
    position: relative;
    min-height: 680px;
    background: linear-gradient(135deg, #e8f0f8, #f0e8f8, #e8f8ec);
    overflow: hidden;
  }
  .map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(155,131,230,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,131,230,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .map-roads {
    position: absolute; inset: 0;
  }
  .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .route-path { fill: none; stroke: var(--ink-900); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 6; }
  .route-done { fill: none; stroke: var(--petal-400); stroke-width: 3; stroke-linecap: round; }

  .pin {
    position: absolute;
    transform: translate(-50%, -100%);
    z-index: 2;
  }
  .pin-round { width: 44px; height: 44px; border-radius: 50%; background: white; border: 3px solid var(--ink-900); display: flex; align-items: center; justify-content: center; color: var(--ink-900); box-shadow: var(--shadow-md); }
  .pin-current {
    width: 56px; height: 56px; border-radius: 50%; background: var(--petal-400); color: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px rgba(245, 169, 140, 0.3);
    animation: pulse3 2s infinite;
  }
  @keyframes pulse3 { 50% { box-shadow: 0 0 0 16px rgba(245, 169, 140, 0.0); } }

  .callout {
    position: absolute;
    background: var(--ink-900);
    color: white;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 12px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
    z-index: 3;
  }
  .callout::after {
    content: '';
    position: absolute; left: 50%; bottom: -5px;
    transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px;
    background: var(--ink-900);
  }
  .callout strong { display: block; font-size: 13px; margin-bottom: 2px; color: white; }
  .callout span { font-size: 11px; color: rgba(255,255,255,0.7); }

  .map-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
  .map-controls button { width: 38px; height: 38px; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--ink-700); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .map-controls button:hover { background: var(--ink-50); }
  .map-view-toggle { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 6px; z-index: 4; }
  .mvt { padding: 8px 14px; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 12px; font-weight: 500; color: var(--ink-700); display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
  .mvt.active { background: var(--ink-900); color: white; border-color: var(--ink-900); }

  /* Product summary */
  .t-product { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; gap: 16px; background: var(--ink-50); }
  .t-product img { width: 72px; height: 72px; border-radius: var(--radius-md); object-fit: cover; }
  .t-product .pn { font-size: 14px; font-weight: 500; color: var(--ink-900); }
  .t-product .pd { font-size: 12px; color: var(--ink-500); line-height: 1.5; }

  @media (max-width: 900px) {
    .track-layout { grid-template-columns: 1fr; }
    .map { min-height: 480px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="assets/shared.js"></script>

    { n: 'Entregue', d: 'Entrega estimada entre 15h e 17h', t: 'Hoje · 17h', state: 'upcoming' },

  const App = () => (
    <div className="page-wrap">

      <main>

    </div>

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
